# CLOMonitor metadata file
# This file must be located at the root of the repository


# Agent readiness information
agentReadiness:
  # URL of the documentation site to analyze with AFDocs
  #
  # CLOMonitor uses the repository's GitHub homepage URL by default. If the
  # documentation that agents should read is hosted elsewhere, this url can be
  # set to run the agent readiness checks against that location.
  url: https://docs.example.org/

# Checks exemptions
exemptions:
  - check: artifacthub_badge # Check identifier (see https://github.com/cncf/clomonitor/blob/main/docs/checks.md#exemptions)
    reason: "" # Justification of this exemption (mandatory, it will be displayed on the UI)

# License scanning information
licenseScanning:
  # URL with the repository's license scanning results
  #
  # CLOMonitor can extract license scanning results from FOSSA and Snyk badges
  # in the repository README.md file automatically. If your repository uses a
  # different scanning solution, this url can be set to pass the corresponding
  # check.
  url: https://license-scanning-results.url
