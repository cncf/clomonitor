[workspace]
resolver = "2"
members = [
    "clomonitor-apiserver",
    "clomonitor-archiver",
    "clomonitor-core",
    "clomonitor-linter",
    "clomonitor-notifier",
    "clomonitor-registrar",
    "clomonitor-runner",
    "clomonitor-tracker",
]

[workspace.package]
version = "1.0.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
anyhow = "1.0.104"
askalono = "0.5.0"
askama = { version = "0.16.1", features = ["serde_json"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
bincode = { version = "2.0.1", features = ["serde"] } # do-not-upgrade
cached = { version = "4.1.0", features = ["async"] }
clap = { version = "4.6.7", features = ["derive"] }
clomonitor-core = { path = "../clomonitor-core" }
comfy-table = "8.0.1"
config = "0.15.27"
deadpool = "0.13.1"
deadpool-postgres = { version = "0.14.2", features = ["serde"] }
futures = "0.3.34"
git2 = "0.21.0"
glob = "0.3.4"
graphql_client = { version = "0.16.0", features = ["reqwest"] }
hex = "0.4.3"
http = "1.5.0"
hyper = "1.12.0"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
mime = "0.3.17"
mockall = "0.15.0"
mockito = "1.7.2"
octorust = "0.3.2" # do-not-upgrade
openssl = { version = "0.10.82", features = ["vendored"] }
postgres-openssl = "0.5.3"
postgres-types = { version = "0.2.14", features = ["derive"] }
predicates = "3.1.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
resvg = "0.27.0" # do-not-upgrade
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
serde_qs = "1.1.3"
sha2 = "0.11.1"
tempfile = "3.27.0"
tera = { version = "2.4.0", default-features = false }
thiserror = "2.0.21"
time = { version = "0.3.55", features = [
    "formatting",
    "macros",
    "parsing",
    "serde",
] }
tiny-skia = "0.8.4" # do-not-upgrade
tokio = { version = "1.54.1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
tokio-postgres = { version = "0.7.18", features = [
    "with-time-0_3",
    "with-serde_json-1",
    "with-uuid-1",
] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = [
    "auth",
    "fs",
    "set-header",
    "trace",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
usvg = "0.27.0" # do-not-upgrade
uuid = { version = "1.29.0", features = ["serde"] }
which = "8.0.6"
wiremock = "0.6.5"
